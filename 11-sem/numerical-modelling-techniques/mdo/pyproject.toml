[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdo"
version = "0.1.0"
description = "Метод дискретних особливостей: стаціонарна (лаб. №1) і нестаціонарна відривна (лаб. №2) течія навколо контуру"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: довгі тести (повний прогін лаб. №2, кілька хвилин)"]
